<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Kursus Mengemudi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-fonts">
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="custom-background">
    .bg-gradient-custom {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 60%, #EFE9FE 100%);
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#5B4099',
              light: '#EFE9FE',
              dark: '#3A2768',
              text: '#1E1E1E',
              gray: '#71717A'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen">
<!-- BEGIN: MainContainer -->
<!-- Mobile container wrapper -->
<main class="w-full max-w-md bg-gradient-custom min-h-screen relative overflow-hidden flex flex-col items-center pt-24 pb-8 px-6">
<!-- BEGIN: IllustrationCard -->
<!-- The central document-like illustration -->
<div class="bg-white w-64 h-80 rounded-xl card-shadow relative overflow-hidden flex flex-col justify-center items-center p-6 mb-12 z-10">
<!-- Decorative background shapes -->
<div class="absolute top-0 right-0 w-32 h-full bg-brand-purple clip-path-polygon z-0" style="clip-path: polygon(100% 0, 100% 100%, 0 100%, 60% 0);"></div>
<div class="absolute bottom-0 right-0 w-full h-24 bg-brand-dark clip-path-polygon z-0 opacity-20" style="clip-path: polygon(100% 100%, 0 100%, 100% 0);"></div>
<!-- Content of the card -->
<div class="relative z-10 flex flex-col items-center">
<!-- Logo -->
<div class="flex items-center gap-1 mb-2">
<span class="text-4xl font-bold text-brand-purple italic">R</span>
<span class="text-3xl font-bold text-brand-purple italic relative -left-1">W</span>
<div class="w-2 h-2 rounded-full bg-brand-purple absolute top-2 right-[-8px]"></div>
</div>
<h2 class="text-brand-purple font-bold text-lg tracking-wide mb-6">RW DEV</h2>
<div class="text-center w-full mt-4">
<p class="text-brand-purple font-semibold text-xs tracking-widest uppercase mb-1">PROPOSAL</p>
<p class="text-brand-purple font-bold text-sm tracking-widest uppercase">PROJECT</p>
</div>
<div class="absolute bottom-4 left-4 text-[8px] text-gray-400">
<p>KURSUS MENGEMUDI</p>
<p>PULUNG GROUP</p>
</div>
</div>
</div>
<!-- END: IllustrationCard -->
<!-- BEGIN: TextContent -->
<!-- Headings and description text -->
<div class="text-center z-10 w-full mb-auto">
<h1 class="text-3xl font-bold text-brand-dark mb-4 leading-tight">
        Belajar Mengemudi<br/>
        Jadi Lebih Mudah &amp;<br/>
        Modern
      </h1>
<p class="text-brand-gray text-sm px-4 leading-relaxed">
        Sistem manajemen dan pembelajaran berkendara terpadu untuk pengalaman yang lebih profesional.
      </p>
</div>
<!-- END: TextContent -->
<!-- BEGIN: BottomActions -->
<!-- Button and version info at the bottom -->
<div class="w-full mt-10 z-10">
<button class="w-full bg-brand-purple hover:bg-brand-dark text-white font-semibold py-4 px-6 rounded-2xl flex justify-center items-center gap-2 transition-colors shadow-lg shadow-brand-purple/30 mb-6">
<span>Mulai Sekarang</span>
<svg class="h-5 w-5" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</button>
<p class="text-center text-xs text-brand-gray/60">
        Versi 2.0.1 © 2024 Pulung Group
      </p>
</div>
<!-- END: BottomActions -->
</main>
<!-- END: MainContainer -->
</body></html>
