# Docker Compose for local VPS-style runs of the Pulung demo.
# The demo itself deploys to Vercel free tier; this file exercises the same
# Dockerfile for the production VPS migration path.
#
# Usage:
#   1. Copy .env.example to .env and fill in real Clerk keys.
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# If .env is absent the placeholder keys below are used (auth will not work,
# but the public landing page renders).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulung:latest
    container_name: pulung-app
    ports:
      - "3000:3000"
    environment:
      # Host env wins (.env file or shell); placeholders are the fallback so
      # the container boots even without a .env file.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_replace_me}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_replace_me}
    restart: unless-stopped
