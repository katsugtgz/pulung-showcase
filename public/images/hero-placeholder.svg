<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Ilustrasi placeholder kursus mengemudi Pulung">
  <defs>
    <!-- Background gradient (brand blue tonal) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FC"/>
      <stop offset="100%" stop-color="#E3EEF8"/>
    </linearGradient>

    <!-- Brand blue gradient (steering wheel) -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a84d6"/>
      <stop offset="100%" stop-color="#1E6FB8"/>
    </linearGradient>

    <!-- Subtle accent gradient (red hub) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D22B3A"/>
      <stop offset="100%" stop-color="#a8222e"/>
    </linearGradient>

    <!-- Soft accent wash -->
    <linearGradient id="wash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FB8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E6FB8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop shadow for the wheel -->
    <filter id="wheel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1E6FB8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background plate -->
  <rect width="800" height="800" rx="24" fill="url(#bg-grad)"/>

  <!-- Decorative ambient circles (atmosphere, non-content) -->
  <circle cx="660" cy="160" r="220" fill="url(#wash-grad)"/>
  <circle cx="140" cy="660" r="180" fill="url(#wash-grad)"/>

  <!-- Curving road ribbons (motion + context) -->
  <path d="M-60,720 Q 240,640 400,540 T 860,420" fill="none" stroke="#1E6FB8" stroke-width="6" stroke-opacity="0.15"/>
  <path d="M-60,740 Q 240,660 400,560 T 860,440" fill="none" stroke="#1E6FB8" stroke-width="3" stroke-opacity="0.10"/>
  <path d="M-60,730 Q 240,650 400,550 T 860,430" fill="none" stroke="#1E6FB8" stroke-width="3" stroke-dasharray="14,14" stroke-opacity="0.22"/>

  <!-- Steering wheel (hero motif) -->
  <g transform="translate(400, 380)" filter="url(#wheel-shadow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#brand-grad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Inner highlight ring -->
    <circle cx="0" cy="0" r="166" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Grip accents -->
    <path d="M -178,-20 A 180,180 0 0,1 -170,-66" fill="none" stroke="#124D85" stroke-width="30" stroke-linecap="round"/>
    <path d="M 178,-20 A 180,180 0 0,0 170,-66" fill="none" stroke="#124D85" stroke-width="30" stroke-linecap="round"/>

    <!-- Center hub (brand red for accent) -->
    <circle cx="0" cy="0" r="52" fill="url(#accent-grad)"/>
    <circle cx="0" cy="0" r="46" fill="#D22B3A"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" opacity="0.95"/>

    <!-- Horizontal spokes -->
    <path d="M -168,0 L -46,0 A 52,52 0 0,0 -38,18 L -38,22 L -156,22 Z" fill="url(#brand-grad)"/>
    <path d="M 168,0 L 46,0 A 52,52 0 0,1 38,18 L 38,22 L 156,22 Z" fill="url(#brand-grad)"/>

    <!-- Bottom spoke -->
    <path d="M -18,46 L -18,150 A 180,180 0 0,0 0,152 A 180,180 0 0,0 18,150 L 18,46 Z" fill="url(#brand-grad)"/>
  </g>

  <!-- Top-left badge: car silhouette (course context) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M 18,34 L 22,24 C 23,21.5 25.5,20 28,20 L 48,20 C 50.5,20 53,21.5 54,24 L 58,34 C 60,34.5 61,35.5 61,37.5 L 61,43 C 61,45 59.5,46 57.5,46 L 56,46 L 56,49 C 56,50.7 54.7,51 53.5,51 C 52.3,51 51,50.7 51,49 L 51,46 L 27,46 L 27,49 C 27,50.7 25.7,51 24.5,51 C 23.3,51 22,50.7 22,49 L 22,46 L 20,46 C 18,46 16.5,45 16.5,43 L 16.5,37.5 C 16.5,35.5 17.5,34.5 19,34 Z" fill="#1E6FB8"/>
    <path d="M 27,30 L 30,25 C 30.5,23.5 31.7,22.8 33,22.8 L 43,22.8 C 44.3,22.8 45.5,23.5 46,25 L 49,30 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="26" cy="38" r="2.5" fill="#FFFFFF"/>
    <circle cx="50" cy="38" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Top-right badge: safety shield (Safe Drive Training motto) -->
  <g transform="translate(676, 60)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M 32,18 L 50,24 L 50,36 C 50,46 42,50 32,53 C 22,50 14,46 14,36 L 14,24 Z" fill="#1E6FB8"/>
    <path d="M 25,35 L 30,40 L 40,28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom-right placeholder tag intentionally omitted — the "Contoh"
       indicator lives as a JSX overlay in hero.tsx so it can be removed
       trivially once an owner-provided photo replaces this SVG. -->
</svg>
