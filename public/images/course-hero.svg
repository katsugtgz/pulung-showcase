<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FBFD"/>
      <stop offset="100%" stop-color="#E8F1F9"/>
    </linearGradient>
    
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a84d6"/>
      <stop offset="100%" stop-color="#1E6FB8"/>
    </linearGradient>
    
    <!-- Light Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FB8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1E6FB8" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E6FB8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Decorative Abstract Shapes -->
  <circle cx="700" cy="100" r="180" fill="url(#accent-grad)" />
  <circle cx="100" cy="300" r="120" fill="url(#accent-grad)" />

  <!-- Road Lines / Wind Lines (Abstract Motion) -->
  <!-- Curving road below -->
  <path d="M-50,380 Q 250,340 400,280 T 850,220" fill="none" stroke="#1E6FB8" stroke-width="4" stroke-opacity="0.15" />
  <path d="M-50,395 Q 250,355 400,295 T 850,235" fill="none" stroke="#1E6FB8" stroke-width="2" stroke-opacity="0.1" />
  
  <!-- Dashed lane line -->
  <path d="M-50,387 Q 250,347 400,287 T 850,227" fill="none" stroke="#1E6FB8" stroke-width="2" stroke-dasharray="12,12" stroke-opacity="0.25" />

  <!-- Hero graphic container -->
  <g transform="translate(400, 200)" filter="url(#drop-shadow)">
    <!-- Inner soft glow -->
    <circle cx="0" cy="0" r="110" fill="#1E6FB8" fill-opacity="0.05" />

    <!-- Steering Wheel Outer Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#brand-grad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Grip accents -->
    <path d="M -94.5,-10 A 95,95 0 0,1 -90,-35" fill="none" stroke="#124D85" stroke-width="16" stroke-linecap="round" />
    <path d="M 94.5,-10 A 95,95 0 0,0 90,-35" fill="none" stroke="#124D85" stroke-width="16" stroke-linecap="round" />

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="28" fill="url(#brand-grad)" />
    <circle cx="0" cy="0" r="25" fill="#1E6FB8" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" opacity="0.9" />

    <!-- Horizontal Spokes -->
    <path d="M -88,0 L -25,0 A 28,28 0 0,0 -20,10 L -20,12 L -82,12 Z" fill="url(#brand-grad)" />
    <path d="M 88,0 L 25,0 A 28,28 0 0,1 20,10 L 20,12 L 82,12 Z" fill="url(#brand-grad)" />
    
    <!-- Bottom Spoke -->
    <path d="M -10,25 L -10,80 A 95,95 0 0,0 0,81 A 95,95 0 0,0 10,80 L 10,25 Z" fill="url(#brand-grad)" />

    <!-- Sleek inner details/highlight on steering wheel -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.25" />
  </g>

  <!-- Left Side: Car Silhouette Badge -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Car Silhouette -->
    <path d="M 15,25 L 18,18 C 18.8,16.2 20.5,15 22.5,15 L 37.5,15 C 39.5,15 41.2,16.2 42,18 L 45,25 C 46.5,25.2 47,26 47,27.5 L 47,32 C 47,33.5 45.8,34 44.5,34 L 43,34 L 43,36.5 C 43,37.8 42,38 41,38 C 40,38 39,37.8 39,36.5 L 39,34 L 21,34 L 21,36.5 C 21,37.8 20,38 19,38 C 18,38 17,37.8 17,36.5 L 17,34 L 15.5,34 C 14.2,34 13,33.5 13,32 L 13,27.5 C 13,26 13.5,25.2 15,25 Z" fill="#1E6FB8" />
    <path d="M 21,23 L 23,19 C 23.3,18 24.2,17.5 25.2,17.5 L 34.8,17.5 C 35.8,17.5 36.7,18 37,19 L 39,23 Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Headlights -->
    <circle cx="20" cy="28" r="2" fill="#FFFFFF" />
    <circle cx="40" cy="28" r="2" fill="#FFFFFF" />
  </g>

  <!-- Right Side: Safety Shield Badge -->
  <g transform="translate(692, 60)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Shield -->
    <path d="M 24,14 L 36,18 L 36,27 C 36,34 30.5,37 24,39 C 17.5,37 12,34 12,27 L 12,18 Z" fill="#1E6FB8" />
    <!-- Checkmark -->
    <path d="M 19,26 L 22.5,29.5 L 29.5,21.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
