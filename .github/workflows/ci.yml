name: CI

# Per AGENTS.md: GitHub Actions is EXPECTED to fail here regardless of code
# quality (account billing issue). This file is authored to the PRD spec; the
# real quality gates are the identical commands run locally:
#   pnpm build && npx react-doctor@latest --json && npx @lhci/cli collect && \
#   npx @lhci/cli assert && pnpm test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  build:
    name: Build (Next standalone)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm build
        run: pnpm build
        # Placeholder Clerk keys let the production build complete without real
        # secrets. The build never validates keys; only runtime requests do.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_replace_me
          CLERK_SECRET_KEY: sk_test_replace_me
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          if-no-files-found: error

  react-doctor:
    name: Quality - react-doctor (score 100)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: react-doctor gate
        run: |
          set -euo pipefail
          npx react-doctor@latest --json --json-out react-doctor-report.json .
          echo "===== react-doctor report ====="
          cat react-doctor-report.json
          echo "==============================="
          SCORE=$(node -e "const d=require('./react-doctor-report.json');const s=d&&d.summary&&d.summary.score;if(typeof s!=='number'){console.error('Could not read numeric score from react-doctor summary.score');process.exit(2)}console.log(s)")
          echo "react-doctor score: $SCORE"
          if [ "$SCORE" -lt 100 ]; then
            echo "::error::react-doctor score $SCORE is below the required 100 (see report artifact)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-doctor-report
          path: react-doctor-report.json
          retention-days: 7

  lighthouse:
    name: Quality - Lighthouse (min 0.9 all categories)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - id: setup-chrome
        name: Setup Chrome (headless via CDP)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Lighthouse CI collect + assert
        run: |
          npx @lhci/cli@0.15.1 collect
          npx @lhci/cli@0.15.1 assert
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_replace_me
          CLERK_SECRET_KEY: sk_test_replace_me

  vitest:
    name: Quality - Vitest unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
